project:
  type: website
  output-dir: _site
  resources:
    - images/
    - calendar/   # .ics files for the Add to calendar buttons
    - CNAME   # tells GitHub Pages to serve the site at gabrielleandriley.com
    - favicon.ico

website:
  title: "Gabrielle & Riley"
  site-url: "https://gabrielleandriley.com"
  image: images/share.jpg
  description: "Gabrielle and Riley are getting married on June 19, 2027 at the Fontainebleau Inn in Alpine, New York."
  open-graph: true
  twitter-card: true
  favicon: images/favicon.svg
  search: false
  navbar:
    background: light
    pinned: true
    logo: ""
    left:
      - href: index.qmd
        text: Home
      - href: travel.qmd
        text: Travel & Stay
      - href: things-to-do.qmd
        text: Things to Do
      - href: faq.qmd
        text: FAQs
      - href: registry.qmd
        text: Registry
  page-footer:
    background: light
    center: |
      <div class="foot"><p class="foot-kicker">We can’t wait to celebrate</p><p class="foot-names">Gabrielle &amp; Riley</p><a href="#" class="to-top">Back to top</a><p class="foot-credits">Stationery designed and printed by <a href="https://www.mangopaperie.com/" target="_blank" rel="noopener">Mango Paperie</a><span class="foot-dot"></span>Engagement photos by <a href="https://kelseytravisphotography.com/" target="_blank" rel="noopener">Kelsey Travis Photography</a></p></div>

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: false
    smooth-scroll: true
    anchor-sections: false
    page-layout: full
    include-in-header:
      text: |
        <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
        <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
