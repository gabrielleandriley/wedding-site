project:
  type: website
  output-dir: _site
  resources:
    - images/
    - CNAME   # tells GitHub Pages to serve the site at gabrielleandriley.com

website:
  title: "Gabrielle & Riley"
  site-url: "https://gabrielleandriley.com"
  image: images/share.jpg
  description: "Gabrielle and Riley are getting married on June 19, 2027 at the Fontainebleau Inn in Alpine, New York."
  open-graph: true
  twitter-card: true
  favicon: images/favicon.svg
  search: false
  navbar:
    background: light
    pinned: true
    logo: ""
    left:
      - href: index.qmd
        text: Home
      - href: travel.qmd
        text: Travel & Stay
      - href: things-to-do.qmd
        text: Things to Do
      - href: faq.qmd
        text: FAQs
      - href: registry.qmd
        text: Registry
  page-footer:
    background: light
    center: |
      <div class="foot"><p class="foot-kicker">We can’t wait to celebrate</p><p class="foot-names">Gabrielle &amp; Riley</p><div class="foot-cols"><div><p class="foot-h">Welcome Party</p><p>Friday, June 18, 2027<br>North Point Pavilion, Taughannock</p></div><div><p class="foot-h">The Wedding</p><p>Saturday, June 19, 2027<br>Fontainebleau Inn, Alpine, New York</p></div></div><a href="#" class="to-top">Back to top</a></div>

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: false
    smooth-scroll: true
    anchor-sections: false
    page-layout: full
